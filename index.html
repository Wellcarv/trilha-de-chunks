<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C7A77">
<title>Trilha de Chunks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700;800&display=swap">
<style>
/* Layout: phone-first app shell. Sticky stats bar, one scrolling view, bottom tab bar; lessons open as a full-screen sheet. */
:root{
  --bg:#EEF5F3; --surface:#FFFFFF; --sunk:#E2ECEA; --ink:#102B2F; --muted:#56706F; --line:#CFDEDB;
  --accent:#0C7A77; --accent-2:#0A615F; --on-accent:#FFFFFF;
  --sun:#EE6A43; --sun-2:#C8502D; --gold:#E3A12F; --gold-2:#B97E17;
  --good:#23925A; --good-bg:#DDF3E6; --bad:#CF3F3F; --bad-bg:#FBE3E1;
  --qa:#3566D0; --reg:#8C45C2; --locked:#B9C8C5;
  --f-display:"Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1A1C; --surface:#132729; --sunk:#0F2123; --ink:#E4F0EE; --muted:#8EA7A6; --line:#23403F;
  --accent:#27AFA6; --accent-2:#1B847D; --on-accent:#05201F;
  --sun:#FF8460; --sun-2:#D0613F; --gold:#F0B54A; --gold-2:#C08A25;
  --good:#3CC07C; --good-bg:#12342A; --bad:#F06A64; --bad-bg:#3A1C1C;
  --qa:#6F97F0; --reg:#B47FE3; --locked:#33504E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1A1C; --surface:#132729; --sunk:#0F2123; --ink:#E4F0EE; --muted:#8EA7A6; --line:#23403F;
  --accent:#27AFA6; --accent-2:#1B847D; --on-accent:#05201F;
  --sun:#FF8460; --sun-2:#D0613F; --gold:#F0B54A; --gold-2:#C08A25;
  --good:#3CC07C; --good-bg:#12342A; --bad:#F06A64; --bad-bg:#3A1C1C;
  --qa:#6F97F0; --reg:#B47FE3; --locked:#33504E; color-scheme:dark }

html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
svg.i{width:22px;height:22px;flex:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.who{display:flex;align-items:center;gap:8px;border:0;background:var(--sunk);border-radius:999px;padding:5px 12px 5px 5px;font-weight:700;min-width:0}
.who .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;flex:none}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.stats{margin-left:auto;display:flex;gap:12px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:3px}
.stat.fire{color:var(--sun)} .stat.gem{color:var(--qa)} .stat.heart{color:var(--bad)}
.stat.off{color:var(--muted)}

main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.view{padding-block:18px}

/* daily goal card */
.goal{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.goal .ring{width:54px;height:54px;flex:none}
.goal b{font-family:var(--f-display);font-size:18px}
.bar{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .5s}

/* path */
.unit{margin-top:22px;border-radius:var(--r);padding:16px;color:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center}
.unit h2{font-size:20px}
.unit p{margin:2px 0 0;opacity:.9;font-size:14px}
.unit .wk{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.unit.w0{background:var(--accent)} .unit.w1{background:var(--sun)} .unit.w2{background:var(--qa)} .unit.w3{background:var(--reg)}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:22px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.node .disc{width:76px;height:72px;border-radius:50%;display:grid;place-items:center;position:relative;background:var(--accent);box-shadow:0 7px 0 var(--accent-2);transition:transform .08s}
.node:active .disc{transform:translateY(5px);box-shadow:0 2px 0 var(--accent-2)}
.node .disc svg{width:34px;height:34px;color:#fff}
.node.done .disc{background:var(--gold);box-shadow:0 7px 0 var(--gold-2)}
.node.locked .disc{background:var(--locked);box-shadow:0 7px 0 var(--line)}
.node.locked{cursor:not-allowed}
.node.review .disc{border-radius:22px;background:var(--sun);box-shadow:0 7px 0 var(--sun-2)}
.node.review.done .disc{background:var(--gold);box-shadow:0 7px 0 var(--gold-2)}
.node.review.locked .disc{background:var(--locked);box-shadow:0 7px 0 var(--line)}
.node .ringsvg{position:absolute;inset:-9px;width:94px;height:90px;pointer-events:none}
.node .cap{font-size:13px;font-weight:700;max-width:180px;text-align:center;line-height:1.25}
.node .day{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.node.current .disc::after{content:"COMEÇAR";position:absolute;top:-34px;background:var(--surface);color:var(--accent);border:2px solid var(--line);border-radius:10px;padding:3px 9px;font-size:11px;font-weight:800;letter-spacing:.08em;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.gap-note{font-size:13px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:12px;padding:8px 12px}

/* popover for node */
.pop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;width:min(100%,360px);display:grid;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.pop h3{font-size:18px}
.lvl{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);text-align:left;width:100%}
.lvl b{display:block}
.lvl .ck{margin-left:auto;font-weight:800;font-size:12px;color:var(--good)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px}
.chip.qa{background:color-mix(in srgb,var(--qa) 15%,transparent);color:var(--qa)}
.chip.reg{background:color-mix(in srgb,var(--reg) 15%,transparent);color:var(--reg)}
.chip.all{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}

/* generic */
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:15px;background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--accent-2);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-2)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sun{background:var(--sun);box-shadow:0 4px 0 var(--sun-2);color:#fff}
.btn.good{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 70%,#000);color:#fff}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000);color:#fff}
.btn[disabled]{background:var(--sunk);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:not-allowed}
.btn.block{width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec-h h2{font-size:22px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.tab{border:2px solid transparent;background:none;border-radius:12px;padding:6px 2px;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--muted)}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent)}

/* overlay & lesson */
.overlay{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 40%,transparent);display:grid;place-items:center;padding:16px}
.lesson{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lesson .head{display:flex;align-items:center;gap:12px;padding-block:14px;width:100%}
.x{border:0;background:none;padding:4px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;flex:none;font-size:14px;font-weight:800}
.lesson .bar{flex:1;height:16px}
.lesson .bar i{background:var(--good)}
.lesson .body{flex:1;overflow-y:auto}
.lesson .body .wrap{padding-block:8px 24px;display:grid;gap:18px}
.q-title{font-family:var(--f-display);font-size:22px;font-weight:800}
.prompt{display:flex;gap:12px;align-items:flex-start}
.speak{width:52px;height:52px;border-radius:14px;border:0;background:var(--qa);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 color-mix(in srgb,var(--qa) 65%,#000)}
.speak.slow{width:40px;height:40px;background:var(--surface);color:var(--qa);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:18px;font-weight:600;min-width:0}
.reveal-box{display:grid;gap:8px;min-width:0}
.reveal summary{cursor:pointer;width:fit-content;padding-block:4px;font-size:14px;font-weight:700;color:var(--accent)}
.reveal .bubble{margin-top:6px}
.bubble .s{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;text-align:left;font-weight:600;box-shadow:0 3px 0 var(--line);font-size:16px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));box-shadow:0 3px 0 var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:10px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:600;box-shadow:0 3px 0 var(--line);font-size:16px}
.tile.used{visibility:hidden}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:10px;align-content:start}
.pair{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 10px;font-weight:600;box-shadow:0 3px 0 var(--line);min-height:56px;font-size:15px}
.pair[aria-pressed="true"]{border-color:var(--qa);background:color-mix(in srgb,var(--qa) 10%,var(--surface))}
.pair.ok{opacity:.35;border-color:var(--good);pointer-events:none}
.pair.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sentence{font-size:20px;font-weight:600;line-height:1.6}
.sentence .blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent)}
.hint{font-size:14px;color:var(--muted)}
.foot{border-top:2px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot .wrap{padding-block:14px;display:grid;gap:10px}
.foot.ok{background:var(--good-bg);border-color:transparent}
.foot.no{background:var(--bad-bg);border-color:transparent}
.fb h3{font-size:20px}
.foot.ok .fb h3{color:var(--good)} .foot.no .fb h3{color:var(--bad)}
.fb p{margin:2px 0 0}
.result{display:grid;gap:16px;justify-items:center;text-align:center;padding-block:30px}
.result h1{font-size:34px}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tiles3 .t{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.tiles3 .t .h{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:4px}
.tiles3 .t .v{font-family:var(--f-display);font-size:24px;font-weight:800;padding:10px 4px;font-variant-numeric:tabular-nums}

/* league, badges, library */
.lg-row{display:grid;grid-template-columns:28px 40px 1fr auto;gap:10px;align-items:center;padding:12px;border-radius:12px}
.lg-row.me{background:color-mix(in srgb,var(--accent) 10%,transparent);outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.lg-row .pos{font-family:var(--f-display);font-weight:800;font-size:18px;text-align:center}
.lg-row .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.lg-row .xp{font-weight:800;font-variant-numeric:tabular-nums}
.tier{display:flex;gap:6px;justify-content:space-between}
.tier div{flex:1;text-align:center;border-radius:12px;padding:8px 4px;border:2px solid var(--line);font-size:12px;font-weight:800}
.tier div.on{border-color:currentColor}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.badge .md{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.badge.got .md{background:var(--gold);color:#fff}
.badge b{display:block;font-size:14px;line-height:1.2}
.badge span{font-size:12px;color:var(--muted)}
.badge:not(.got){opacity:.7}
.lib{display:grid;gap:8px}
.lib-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lib-item .en{font-weight:700}
.lib-item .pt{font-size:13px;color:var(--muted)}
.str{display:flex;gap:2px}
.str i{width:6px;height:16px;border-radius:2px;background:var(--sunk)}
.str i.on{background:var(--good)}
.mini-sp{width:34px;height:34px;border-radius:10px;border:0;background:color-mix(in srgb,var(--qa) 14%,transparent);color:var(--qa);display:grid;place-items:center}
.search{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font:inherit;color:inherit}
.pick{display:grid;gap:12px}
.pick button{display:flex;gap:14px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;box-shadow:0 4px 0 var(--line)}
.pick .av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none}
.field{display:grid;gap:6px}
.field input,.field select{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font:inherit;color:inherit}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:40px 10px;display:grid;gap:10px;justify-items:center}
.watch{border-left:4px solid var(--sun);padding-left:12px}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--sun);color:#fff;display:grid;place-items:center;margin:0 auto;box-shadow:0 6px 0 var(--sun-2)}
.mic svg{width:44px;height:44px}
.mic.on{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 var(--sun-2),0 0 0 14px color-mix(in srgb,var(--sun) 25%,transparent)}}
.heard{font-size:15px;color:var(--muted);text-align:center;min-height:22px}
.scored{font-size:20px;font-weight:600;line-height:1.7}
.scored .w-ok{color:var(--good)}
.scored .w-no{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.score{font-family:var(--f-display);font-weight:800;font-size:28px;text-align:center}
.dict{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font:inherit;color:inherit;font-size:17px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-heart" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11Z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="m12 2.5 2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8 2.9-6Z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1Zm2 0h6V7a3 3 0 0 0-6 0v3Z"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path fill="currentColor" d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V18h3v3H8v-3h3v-3.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3V3Zm10 4v3a2 2 0 0 0 1-1.7V7h-1ZM6 7v1.3A2 2 0 0 0 7 10V7H6Z"/></symbol>

<script>
(() => {
"use strict";

/* ---------- constants ---------- */
const PROFILES = {
  qa:  { label:"Trilha QA", track:"qa", color:"var(--qa)", short:"QA" },
  reg: { label:"Trilha Regulatório", track:"reg", color:"var(--reg)", short:"RA" },
  geral: { label:"Só dia a dia", track:null, color:"var(--sun)", short:"DD" }
};
const WEEK_THEMES = ["", "Se apresentar e bater papo","Drive-thru e restaurantes","Publix e Walmart","Escola e atividades da criança","Saúde: consulta e farmácia","Saúde: urgência","Apartamento e vizinhança","Serviços do dia a dia","Contar histórias","Opiniões e planos","Telefone e imprevistos","Revisão geral","Consolidação"];
const MONTH_OF = w => w<=4 ? "Mês 1 · Sobrevivência" : w<=8 ? "Mês 2 · Fluência prática" : "Mês 3 · Entrevista e simulações";
const MAX_HEARTS = 5, REFILL_MS = 30*60*1000;
const SRS_DAYS = [0,1,2,4,7,15];
const TIERS = [{n:"Bronze",min:0,c:"#B5733A"},{n:"Prata",min:150,c:"#8A9BA8"},{n:"Ouro",min:350,c:"#D9A11E"},{n:"Diamante",min:700,c:"#3FA7D6"}];
const ICON = (id, cls="i") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

/* ---------- state ---------- */
const S = { lessons:[], loaded:false, late:false, slow:false, db:null, pid:null, prof:{}, tab:"path", toastT:0, sound:true };
const LS = {
  get(k,d){ try{ const v=localStorage.getItem("chunks."+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem("chunks."+k, JSON.stringify(v)); }catch(e){} }
};
S.pid = LS.get("pid", null);
S.sound = LS.get("sound", true);

function blankProfile(){
  return { name:"", xp:0, gems:50, streak:0, bestStreak:0, lastDay:"", freezes:0, hearts:MAX_HEARTS, heartsAt:0,
    goal:30, today:{d:"",xp:0}, week:{}, levels:{}, srs:{}, badges:[], perfect:0, lessonsDone:0, practiceDone:0 };
}
const P = () => { const p = S.prof[S.pid] || (S.prof[S.pid] = blankProfile()); return p; };

/* ---------- utils ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dayDiff = (a,b) => Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
function weekKey(d=new Date()){ const x=new Date(d); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function hkey(s){ let h=2166136261; for(const c of s.toLowerCase()){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return "k"+(h>>>0).toString(36); }
const nameOf = pid => (S.prof[pid]?.name || "").trim();
const fill = s => String(s||"").replace(/\{name\}/g, nameOf(S.pid) || "Alex");
const norm = s => String(s).toLowerCase().replace(/[“”"«»]/g,"").replace(/[.,!?;:…]/g,"").replace(/[’']/g,"'").replace(/\s+/g," ").trim();
const words = s => fill(s).replace(/[“”"]/g,"").split(/\s+/).filter(Boolean);
const clean = w => w.replace(/^[^\w']+|[^\w'$%]+$/g,"");

function toast(msg){ clearTimeout(S.toastT); let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t);} t.textContent=msg; t.hidden=false; S.toastT=setTimeout(()=>t.hidden=true,2600); }

/* ---------- audio ---------- */
let voice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voice = vs.find(v=>/en-US/i.test(v.lang)&&/(Samantha|Google US|Aria|Jenny|Ava|Allison)/i.test(v.name)) || vs.find(v=>/en-US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
let sayT=0, sayGen=0, lastU=null;
function say(text, slow, gentle, onEnd){ try{ if(document.hidden) return; sayGen++; clearTimeout(sayT); const busy=speechSynthesis.speaking||speechSynthesis.pending; const u=new SpeechSynthesisUtterance(fill(text).replace(/\.\.\./g,", ")); lastU=u; speechSynthesis.resume(); speechSynthesis.cancel(); u.lang="en-US"; if(voice) u.voice=voice; u.rate = slow?0.6:(S.slow||gentle?0.8:0.95); if(onEnd) u.onend=()=>{ if(lastU===u) onEnd(); };
  if(busy) sayT=setTimeout(()=>{ try{ if(lastU===u) speechSynthesis.speak(u); }catch(e){} },80); else speechSynthesis.speak(u); }catch(e){ toast("O áudio não está disponível neste navegador."); } }
function hush(){ clearTimeout(sayT); clearTimeout(S.autoT); lastU=null; const g=++sayGen; try{ speechSynthesis.resume(); speechSynthesis.cancel(); setTimeout(()=>{ if(g===sayGen) try{ speechSynthesis.cancel(); }catch(e){} },200); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.hidden) hush(); });
window.addEventListener("pagehide",hush);
let actx=null;
function beep(ok){ if(!S.sound) return; try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const t=actx.currentTime; const notes = ok?[660,880]:[220,180];
  notes.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type=ok?"triangle":"sawtooth"; o.frequency.value=f; g.gain.setValueAtTime(.0001,t+i*.09); g.gain.exponentialRampToValueAtTime(ok?.18:.08,t+i*.09+.02); g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.16); o.connect(g).connect(actx.destination); o.start(t+i*.09); o.stop(t+i*.09+.18); }); }catch(e){} }

/* ---------- speech recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const NUM = {"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","12":"twelve","15":"fifteen","20":"twenty","40":"forty"};
const CONTR = {"i'm":"i am","it's":"it is","that's":"that is","what's":"what is","we're":"we are","you're":"you are","they're":"they are","i'll":"i will","i'd":"i would","i've":"i have","we've":"we have","don't":"do not","doesn't":"does not","didn't":"did not","can't":"cannot","won't":"will not","isn't":"is not","aren't":"are not","let's":"let us","there's":"there is","here's":"here is","how's":"how is","where's":"where is","who's":"who is","gonna":"going to","wanna":"want to","gotta":"got to","kinda":"kind of","ya":"you","y'all":"you all"};
function speechTokens(s){
  return norm(s).replace(/[—–\-\/]/g," ").replace(/\$/g," ").split(" ").filter(Boolean)
    .flatMap(w=>{ w=w.replace(/[^a-z0-9']/g,""); if(!w) return []; if(NUM[w]) w=NUM[w]; const c=CONTR[w]; return c?c.split(" "):[w]; });
}
function scoreSpeech(target, heard){
  const tw = norm(fill(target)).replace(/[—–]/g," ").split(" ").filter(Boolean);
  const tt = tw.map(w=>speechTokens(w));
  const flatT = []; tt.forEach((arr,i)=>arr.forEach(x=>flatT.push({x,i})));
  const H = speechTokens(heard);
  const n=flatT.length, m=H.length; const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j] = flatT[i].x===H[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Set(); let i=0,j=0; while(i<n&&j<m){ if(flatT[i].x===H[j]){ hit.add(i); i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  const okWord = tt.map((arr,wi)=>{ const idx=flatT.map((f,k)=>f.i===wi?k:-1).filter(k=>k>=0); return idx.length? idx.every(k=>hit.has(k)) : true; });
  const shown = fill(target).replace(/[“”"]/g,"").split(/\s+/).filter(Boolean);
  const marks = shown.map((w,k)=>({w, ok: okWord[k]!==false}));
  return { score: n? hit.size/n : 0, marks, heard };
}

/* ---------- hearts ---------- */
function hearts(){ const p=P(); if(p.hearts>=MAX_HEARTS) return MAX_HEARTS; const gained=Math.floor((Date.now()-(p.heartsAt||Date.now()))/REFILL_MS); return Math.min(MAX_HEARTS,p.hearts+Math.max(0,gained)); }
function setHearts(n){ const p=P(); const cur=hearts(); if(n<cur && cur>=MAX_HEARTS) p.heartsAt=Date.now(); else if(n<MAX_HEARTS){ const gained=Math.floor((Date.now()-(p.heartsAt||Date.now()))/REFILL_MS); p.heartsAt=(p.heartsAt||Date.now())+gained*REFILL_MS; } p.hearts=Math.max(0,Math.min(MAX_HEARTS,n)); if(p.hearts>=MAX_HEARTS) p.heartsAt=0; }
function nextHeartIn(){ const p=P(); if(hearts()>=MAX_HEARTS) return 0; const since=(Date.now()-(p.heartsAt||Date.now()))%REFILL_MS; return Math.ceil((REFILL_MS-since)/60000); }

/* ---------- persistence ---------- */
let saving=Promise.resolve();
function save(){
  const pid=S.pid, body=JSON.parse(JSON.stringify(P()));
  LS.set("prof."+pid, body);
}
function loadLocal(){ for(const k of Object.keys(PROFILES)){ const v=LS.get("prof."+k,null); if(v) S.prof[k]=Object.assign(blankProfile(),v); } }

/* ---------- lesson model ---------- */
const sortedLessons = () => S.lessons.slice().sort((a,b)=>a.day-b.day);
function trackOf(l, pid){ const t=PROFILES[pid].track; if(!t) return null; return l[t] && (l[t].chunks?.length || l[t].dialog?.length) ? l[t] : null; }
function levelsFor(l){ return l.review ? 1 : 3; }
function levelDone(day){ return P().levels[day]||0; }
function nodeState(list, idx){
  const l=list[idx], lv=levelDone(l.day);
  if(lv>=levelsFor(l)) return "done";
  if(idx===0) return "open";
  const prev=list[idx-1]; return levelDone(prev.day)>=1 ? "open" : "locked";
}
function weekChunks(week, part){ const out=[]; for(const l of S.lessons) if(l.week===week){ const sec = part==="common"? l.common : trackOf(l,S.pid); if(sec?.chunks) out.push(...sec.chunks); } return out; }
function allChunks(part){ const out=[]; for(const l of S.lessons){ const sec = part==="common"? l.common : trackOf(l,S.pid); if(sec?.chunks) out.push(...sec.chunks.map(c=>({...c,day:l.day}))); } return out; }
function allDialogYou(){ const out=[]; for(const l of S.lessons) for(const sec of [l.common, trackOf(l,S.pid)]) for(const d of (sec?.dialog||[])) if(d.s==="You") out.push(d); return out; }
const isHear = c => /^\(Você vai ouvir\)/.test(c.pt);
const ptOf = c => fill(c.pt).replace(/^\(Você vai ouvir\)\s*/,"");

/* ---------- exercise generation ---------- */
function exFromChunk(c, pool, kinds){
  const k = kinds[Math.floor(Math.random()*kinds.length)];
  const others = pool.filter(x=>x.en!==c.en);
  if(k==="en_pt") return {type:"choice", title:"Qual é a tradução?", say:c.en, show:fill(c.en), options:shuffle([ptOf(c),...pick(uniq(others.map(ptOf)),3)]), answer:ptOf(c), c};
  if(k==="pt_en") return {type:"choice", title:"Como se diz em inglês?", show:ptOf(c), options:shuffle([fill(c.en),...pick(uniq(others.map(x=>fill(x.en))),3)]), answer:fill(c.en), c, sayAnswer:true};
  if(k==="build"||k==="listen"){
    const w=words(c.en); if(w.length>12) return exFromChunk(c,pool,["en_pt","pt_en"]);
    const have=new Set(w.map(x=>norm(clean(x))));
    const extra=pick(uniq(others.flatMap(x=>words(x.en)).map(clean).filter(x=>x.length>2&&!have.has(norm(x)))), w.length>8?2:3);
    return {type:"build", listen:k==="listen", title: k==="listen"?"Escreva o que você ouviu":"Monte a frase em inglês", show: k==="listen"?"":ptOf(c), say:c.en, tiles:shuffle([...w.map(clean),...extra]), answer:fill(c.en), c};
  }
  if(k==="gap"){
    const w=words(c.en); const cand=w.map((x,i)=>({x:clean(x),i})).filter(o=>o.x.length>=4 && !/^\{|\d/.test(o.x)).sort((a,b)=>b.x.length-a.x.length);
    if(!cand.length) return exFromChunk(c,pool,["en_pt","build"]);
    const g=cand[Math.floor(Math.random()*Math.min(3,cand.length))];
    const distr=pick(uniq(others.flatMap(x=>words(x.en)).map(clean).filter(x=>x.length>=4&&norm(x)!==norm(g.x))),3);
    const parts=w.map((x,i)=> i===g.i ? x.replace(g.x,"\u0000") : x).join(" ");
    return {type:"gap", title:"Complete a frase", sentence:parts, options:shuffle([g.x,...distr]), answer:g.x, hintPt:ptOf(c), say:c.en, c};
  }
  if(k==="speak") return {type:"speak", title:"Fale em voz alta", say:c.en, show:fill(c.en), pt:ptOf(c), c};
  return exFromChunk(c,pool,["en_pt"]);
}
const uniq = a => [...new Set(a.filter(Boolean))];
function matchEx(cs){ const sel=cs.slice(0,5); return {type:"match", title:"Toque nos pares", pairs:sel.map(c=>({k:hkey(c.en),en:fill(c.en),pt:ptOf(c),c}))}; }
function dialogExs(dlg, n){
  const youAll=allDialogYou(); const out=[];
  const idxs=[]; for(let i=0;i<dlg.length;i++){ if(dlg[i].s==="You" && i>0 && dlg[i-1].s!=="You") idxs.push(i); }
  for(const i of pick(idxs,n)){
    const right=fill(dlg[i].en); const distr=pick(uniq(youAll.map(d=>fill(d.en)).filter(x=>x!==right)),2);
    out.push({type:"dialog", title:"Escolha a melhor resposta", ctx:dlg[i-1], options:shuffle([right,...distr]), answer:right, pt:fill(dlg[i].pt), say:dlg[i].en});
  }
  return out;
}
function buildLesson(l, level){
  const tr = trackOf(l,S.pid);
  let pool, title, exs=[];
  if(l.review){
    const common = weekChunks(l.week,"common").filter(c=>!isHear(c)), trk = weekChunks(l.week,"track").filter(c=>!isHear(c));
    pool = [...pick(common,6), ...pick(trk,5)];
    exs.push(matchEx(pick(pool,5)));
    for(const c of pool) exs.push(exFromChunk(c, [...common,...trk], ["en_pt","pt_en","build","listen","gap"]));
    exs.push(...dialogExs(l.common.dialog,2)); if(tr) exs.push(...dialogExs(tr.dialog,2));
    exs.push(...pick(pool,2).map(c=>exFromChunk(c,pool,["speak"])));
    return {title:"Revisão da semana "+l.week, exs:shuffleKeepFirst(exs).slice(0,16), chunks:pool};
  }
  if(level===0){ pool=l.common.chunks; title="Dia a dia"; }
  else if(level===1){ pool = tr ? tr.chunks : l.common.chunks; title = tr ? (S.pid==="qa"?"Inglês de QA":"Inglês regulatório") : "Dia a dia · reforço"; }
  else { pool=[...(tr?.chunks||[]), ...l.common.chunks]; title="Diálogos e fala"; }
  const learn = pool.filter(c=>!isHear(c));
  const big = [...allChunks("common"),...allChunks("track")];
  if(level<2){
    exs.push(matchEx(pick(learn,5)));
    const kinds = level===0 ? ["en_pt","pt_en","build","listen","gap"] : ["en_pt","pt_en","build","gap","listen"];
    for(const c of pool) exs.push(exFromChunk(c, big, isHear(c)?["en_pt"]:kinds));
    exs.push(...pick(learn,1).map(c=>exFromChunk(c,big,["speak"])));
    return {title, exs:shuffleKeepFirst(exs).slice(0,12), chunks:pool};
  }
  exs.push(...dialogExs(l.common.dialog,3));
  if(tr) exs.push(...dialogExs(tr.dialog,3));
  exs.push(...pick(learn,3).map(c=>exFromChunk(c,big,["speak"])));
  exs.push(...pick(learn,3).map(c=>exFromChunk(c,big,["listen","build"])));
  return {title, exs:shuffle(exs).slice(0,12), chunks:pool};
}
function shuffleKeepFirst(a){ return [a[0], ...shuffle(a.slice(1))]; }
function practiceLesson(mode){
  const p=P(); const now=Date.now();
  let pool=[...allChunks("common"),...allChunks("track")].filter(c=>!isHear(c));
  if(!pool.length) return null;
  if(mode==="weak"){
    const scored=pool.map(c=>{ const r=p.srs[hkey(c.en)]; return {c, s:r?r.s:-1, due:r?r.due:0}; })
      .filter(o=>o.s>=0).sort((a,b)=> (a.due<=now?0:1)-(b.due<=now?0:1) || a.s-b.s);
    pool = scored.length>=6 ? scored.slice(0,10).map(o=>o.c) : pick(pool,10);
    return {title:"Pontos fracos", practice:true, exs:[matchEx(pick(pool,5)), ...pool.map(c=>exFromChunk(c,pool,["en_pt","pt_en","build","gap"]))].slice(0,11), chunks:pool};
  }
  if(mode==="listen"){ pool=pick(pool,8); return {title:"Treino de escuta", practice:true, exs:pool.map(c=>exFromChunk(c,pool,["listen"])), chunks:pool}; }
  if(mode==="speak"){ pool=pick(pool,8); return {title:"Treino de fala", practice:true, exs:pool.map(c=>exFromChunk(c,pool,["speak"])), chunks:pool}; }
  return null;
}

/* ---------- render shell ---------- */
function renderTop(){
  const p=P(), pr=PROFILES[S.pid]; const h=hearts();
  $("#top").innerHTML = `<div class="wrap">
    <button class="who" id="whoBtn" aria-label="Trocar de perfil"><span class="dot" style="background:${pr.color}">${esc((nameOf(S.pid)||pr.short).slice(0,2).toUpperCase())}</span><span>${esc(nameOf(S.pid)||pr.label)}</span></button>
    <div class="stats">
      <span class="stat fire ${p.lastDay===today()?"":"off"}" title="Sequência de dias">${ICON("fire")}${p.streak}</span>
      <span class="stat gem" title="Gemas">${ICON("gem")}${p.gems}</span>
      <span class="stat heart" title="Corações">${ICON("heart")}${h}</span>
    </div></div>`;
  $("#whoBtn").onclick = openSettings;
}
function renderTabs(){
  const T=[["path","Trilha","path"],["practice","Praticar","dumbbell"],["league","Liga","shield"],["badges","Conquistas","medal"]];
  $("#tabs").innerHTML = T.map(([k,l,i])=>`<button class="tab" data-t="${k}" ${S.tab===k?'aria-current="page"':""}>${ICON(i)}${l}</button>`).join("");

/* ---------- path ---------- */
function goalRing(pct){ const r=22, c=2*Math.PI*r; return `<svg class="ring" viewBox="0 0 54 54"><circle cx="27" cy="27" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="7"/><circle cx="27" cy="27" r="${r}" fill="none" stroke="var(--gold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 27 27)"/><use href="#i-star" x="16" y="16" width="22" height="22" style="color:var(--gold)"/></svg>`; }
function viewPath(){
  const p=P();
  if(!S.loaded) return `<div class="wrap view"><div class="empty"><h2>Carregando suas lições…</h2><p class="muted">${S.late?"As lições ainda não chegaram. Confira a conexão; a página continua tentando.":"Buscando o conteúdo do programa."}</p></div></div>`;
  if(!S.lessons.length) return `<div class="wrap view"><div class="empty"><h2>Nenhuma lição ainda</h2><p class="muted">As lições aparecem aqui assim que o plano diário de inglês é enviado.</p></div></div>`;
  const todayXp = p.today.d===today()?p.today.xp:0; const pct=Math.min(1,todayXp/p.goal);
  const list=sortedLessons(); let html=`<div class="wrap view">
    <div class="goal">${goalRing(pct)}<div style="flex:1;min-width:0"><div class="lbl">Meta diária</div><b>${todayXp} / ${p.goal} XP</b><div class="bar" style="margin-top:6px"><i style="width:${pct*100}%"></i></div></div></div>`;
  let curWeek=0, currentMarked=false, prevDay=0;
  list.forEach((l,idx)=>{
    if(l.week!==curWeek){ if(curWeek) html+=`</div>`; curWeek=l.week;
      html+=`<div class="unit w${(l.week-1)%4}"><div><div class="wk">Semana ${l.week} · ${MONTH_OF(l.week)}</div><h2>${esc(WEEK_THEMES[l.week]||"Semana "+l.week)}</h2></div><div style="font-family:var(--f-display);font-weight:800;font-size:26px">${weekProgress(l.week)}</div></div><div class="path">`; }
    if(prevDay && l.day-prevDay>1) html+=`<div class="gap-note">Dia${l.day-prevDay>2?"s":""} ${prevDay+1}${l.day-prevDay>2?"–"+(l.day-1):""} sem lição enviada</div>`;
    prevDay=l.day;
    const st=nodeState(list,idx); const lv=levelDone(l.day), tot=levelsFor(l);
    const isCur = st==="open" && !currentMarked; if(isCur) currentMarked=true;
    const off = Math.round(Math.sin(idx*1.05)*70);
    const icon = st==="locked" ? "lock" : l.review ? "trophy" : st==="done" ? "check" : "star";
    html+=`<button class="node ${st} ${l.review?"review":""} ${isCur?"current":""}" data-day="${l.day}" style="transform:translateX(${off}px)" aria-label="Dia ${l.day}: ${esc(l.title)}${st==="locked"?" (bloqueado)":""}">
      <span class="disc">${ringSvg(lv,tot,st)}${ICON(icon)}</span><span class="day">DIA ${l.day}</span><span class="cap">${esc(l.title)}</span></button>`;
  });
  html+=`</div>`;
  const next=list.length?list[list.length-1].day+1:1;
  if(next<=91) html+=`<p class="gap-note" style="margin-top:8px">Dia ${next} chega amanhã de manhã, junto com o e-mail.</p>`;
  return html+`</div>`;
}
function ringSvg(lv,tot,st){ if(tot<=1||st==="locked") return ""; const r=42, c=2*Math.PI*r, seg=c/tot;
  let s=`<svg class="ringsvg" viewBox="0 0 94 90"><g transform="rotate(-90 47 45)">`;
  for(let i=0;i<tot;i++) s+=`<circle cx="47" cy="45" r="${r}" fill="none" stroke="${i<lv?"var(--gold)":"var(--line)"}" stroke-width="5" stroke-dasharray="${seg-6} ${c-seg+6}" stroke-dashoffset="${-i*seg}"/>`;
  return s+`</g></svg>`; }
function weekProgress(w){ const ls=S.lessons.filter(l=>l.week===w); const done=ls.reduce((a,l)=>a+Math.min(levelDone(l.day),levelsFor(l)),0), tot=ls.reduce((a,l)=>a+levelsFor(l),0); return tot?Math.round(done/tot*100)+"%":""; }

function openNode(day){
  const list=sortedLessons(); const idx=list.findIndex(l=>l.day===day); const l=list[idx]; const st=nodeState(list,idx);
  if(st==="locked"){ toast("Complete a lição anterior para desbloquear."); return; }
  const lv=levelDone(day); const tr=trackOf(l,S.pid);
  if(lv<levelsFor(l)){ startLesson(l, lv); return; }
  const levels = l.review ? [{n:"Revisão completa",d:"Chunks e diálogos da semana inteira"}] :
    [{n:"Dia a dia",d:`${l.common.chunks.length} chunks · para os dois`},
     {n: tr ? (S.pid==="qa"?"Inglês de QA":"Inglês regulatório") : "Reforço do dia a dia", d: tr ? `${tr.chunks.length} chunks · só sua trilha` : (PROFILES[S.pid].track ? "Sua trilha começou depois deste dia" : "Os mesmos chunks, com outros exercícios")},
     {n:"Diálogos e fala",d:"Responder no diálogo e falar em voz alta"}];
  const w=l.watch;
  layer(`<div class="pop" role="dialog" aria-label="Dia ${day}">
    <div><div class="lbl">Dia ${day} · Semana ${l.week}</div><h3>${esc(l.title)}</h3></div>
    ${levels.map((v,i)=>`<button class="lvl" data-lv="${i}"><span><b>${i+1}. ${esc(v.n)}</b><span class="tiny muted">${esc(v.d)}</span></span><span class="ck">FEITO · REFAZER</span></button>`).join("")}
    ${w?`<div class="watch"><div class="lbl">Para assistir juntos</div><b>${esc(w.title)}</b> <span class="muted tiny">· ${esc(w.where)}</span><p class="tiny" style="margin:4px 0 0">${esc(w.tip)}</p></div>`:""}
    <button class="btn ghost" id="closePop">Fechar</button></div>`, true);
  $("#closePop").onclick=closeLayer;
  document.querySelectorAll(".lvl").forEach(b=>b.onclick=()=>{ closeLayer(); startLesson(l, +b.dataset.lv); });
}

/* ---------- lesson runner ---------- */
function startLesson(l, level){
  if(hearts()<=0){ noHearts(); return; }
  try{ runLesson(buildLesson(l, level), l, level); }
  catch(e){ console.error(e); $(".lesson")?.remove(); document.body.style.overflow=""; toast("Não foi possível abrir a lição: "+e.message); }
}
function noHearts(){
  layer(`<div class="pop" role="dialog"><div style="color:var(--bad)">${ICON("heart")}</div><h3>Seus corações acabaram</h3>
    <p class="muted">Faça uma sessão de prática para ganhar um coração, espere ${nextHeartIn()} min pelo próximo ou recarregue com gemas.</p>
    <button class="btn" id="nhPr">Praticar e recuperar</button><button class="btn ghost" id="nhBuy">Recarregar · 50 gemas</button><button class="btn ghost" id="nhX">Agora não</button></div>`, true);
  $("#nhPr").onclick=()=>{ closeLayer(); runLesson(practiceLesson("weak"),null,null); };
  $("#nhBuy").onclick=()=>{ closeLayer(); buy("hearts"); };
  $("#nhX").onclick=closeLayer;

function runLesson(L, lessonRef, level){
  const R={ queue:L.exs.slice(), total:L.exs.length, done:0, mistakes:0, started:Date.now(), results:new Map(), practice:!!L.practice };
  let killMic=()=>{};
  const autoSay = (...a) => { clearTimeout(S.autoT); S.autoT=setTimeout(()=>{ if(el.isConnected) say(...a); },250); };
  const el=document.createElement("div"); el.className="lesson"; el.setAttribute("role","dialog"); el.setAttribute("aria-label",L.title);
  document.body.appendChild(el); document.body.style.overflow="hidden";
  const quit=()=>{ el.remove(); document.body.style.overflow=""; hush(); render(); };
  function frame(inner, footHtml, footCls=""){
    const h = R.practice ? "" : `<span class="stat heart">${ICON("heart")}${hearts()}</span>`;
    el.innerHTML=`<div class="wrap head"><button class="x" id="lx" aria-label="Voltar para o início">${ICON("x")}Início</button><div class="bar"><i style="width:${R.done/R.total*100}%"></i></div>${h}</div>
      <div class="body"><div class="wrap">${inner}</div></div><div class="foot ${footCls}"><div class="wrap">${footHtml}</div></div>`;
    $("#lx",el).onclick=()=>confirmQuit();
  }
  function confirmQuit(){
    killMic(); hush();
    const foot=$(".foot .wrap",el); foot.innerHTML=`<div class="fb"><h3>Voltar para o início?</h3><p class="muted">O progresso desta lição será perdido.</p></div><button class="btn bad block" id="qY">Voltar para o início</button><button class="btn ghost block" id="qN">Continuar estudando</button>`;
    $("#qY",el).onclick=()=>{ if(S.tab!=="path"){ S.tab="path"; window.scrollTo(0,0); } quit(); }; $("#qN",el).onclick=()=>show();
  }
  function srsMark(c, ok){ if(!c) return; const k=hkey(c.en); const prev=R.results.get(k); if(prev===false) return; R.results.set(k, ok && prev!==false); }
  function show(){
    hush(); R.replay=null;
    const ex=R.queue[0]; if(!ex) return finish();
    let sel=null;
    const check = `<button class="btn block" id="chk" disabled>Verificar</button>`;
    const speakBtns = (t,gentle) => `<div class="row" style="flex-direction:column;gap:8px"><button class="speak" data-sp="${esc(t)}" ${gentle?'data-gentle="1"':""} aria-label="Ouvir">${ICON("sound")}</button><button class="speak slow" data-sp="${esc(t)}" data-slow="1" aria-label="Ouvir devagar">${ICON("turtle")}</button></div>`;
    if(ex.type==="choice"){
      frame(`<div class="q-title">${ex.title}</div><div class="prompt">${ex.say?speakBtns(ex.say):""}<div class="bubble">${esc(ex.show)}</div></div>
        <div class="opts">${ex.options.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false">${esc(o)}</button>`).join("")}</div>`, check);
      el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ el.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); sel=ex.options[+b.dataset.i]; $("#chk",el).disabled=false; if(ex.sayAnswer) say(sel); });
      if(ex.say) autoSay(ex.say);
      $("#chk",el).onclick=()=>verdict(norm(sel)===norm(ex.answer), ex);
    }
    else if(ex.type==="build"){
      const chosen=[];
      frame(`<div class="q-title">${ex.title}</div><div class="prompt">${speakBtns(ex.say,ex.listen)}${ex.listen?`<div class="reveal-box"><div class="hint">Toque no alto-falante quantas vezes quiser.</div><details class="reveal"><summary>Ver o que foi falado</summary><div class="bubble">${esc(fill(ex.say))}</div></details></div>`:`<div class="bubble">${esc(ex.show)}</div>`}</div>
        <div class="answer" id="ans" aria-label="Sua resposta"></div><div class="bank" id="bank">${ex.tiles.map((t,i)=>`<button class="tile" data-i="${i}">${esc(t)}</button>`).join("")}</div>`, check);
      const redraw=()=>{ $("#ans",el).innerHTML=chosen.map((i,pos)=>`<button class="tile" data-pos="${pos}">${esc(ex.tiles[i])}</button>`).join("");
        el.querySelectorAll("#bank .tile").forEach(b=>b.classList.toggle("used",chosen.includes(+b.dataset.i)));
        $("#ans",el).querySelectorAll(".tile").forEach(b=>b.onclick=()=>{ chosen.splice(+b.dataset.pos,1); redraw(); });
        $("#chk",el).disabled=!chosen.length; };
      el.querySelectorAll("#bank .tile").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(chosen.includes(i)) return; chosen.push(i); redraw(); });
      autoSay(ex.say,false,ex.listen);
      $("#chk",el).onclick=()=>verdict(norm(chosen.map(i=>ex.tiles[i]).join(" "))===norm(ex.answer), ex);
    }
    else if(ex.type==="gap"){
      const parts=ex.sentence.split("\u0000");
      frame(`<div class="q-title">${ex.title}</div><div class="sentence">${esc(parts[0])}<span class="blank" id="blank">&nbsp;</span>${esc(parts[1]||"")}</div><div class="hint">${esc(ex.hintPt)}</div>
        <div class="opts" style="grid-template-columns:1fr 1fr">${ex.options.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false" style="text-align:center">${esc(o)}</button>`).join("")}</div>`, check);
      el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ el.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); sel=ex.options[+b.dataset.i]; $("#blank",el).textContent=sel; $("#chk",el).disabled=false; });
      $("#chk",el).onclick=()=>verdict(norm(sel)===norm(ex.answer), ex);
    }
    else if(ex.type==="dialog"){
      frame(`<div class="q-title">${ex.title}</div><div class="bubble"><span class="s">${esc(ex.ctx.s)}</span>${esc(fill(ex.ctx.en))}<div class="hint" style="margin-top:4px">${esc(fill(ex.ctx.pt))}</div></div>
        <div class="row"><button class="speak slow" data-sp="${esc(ex.ctx.en)}" aria-label="Ouvir a fala">${ICON("sound")}</button><span class="hint">Ouvir a fala</span></div>
        <div class="opts">${ex.options.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false">${esc(o)}</button>`).join("")}</div>`, check);
      el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ el.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); sel=ex.options[+b.dataset.i]; $("#chk",el).disabled=false; });
      autoSay(ex.ctx.en);
      $("#chk",el).onclick=()=>verdict(norm(sel)===norm(ex.answer), ex);
    }
    else if(ex.type==="speak"){
      let tries=0, best=0, lastHtml="";
      const target=fill(ex.say);
      const body = SR ? `<button class="mic" id="micBtn" aria-label="Tocar e falar">${ICON("mic")}</button><div class="heard" id="heard">Toque no microfone e fale a frase</div>`
                      : `<label class="hint" for="dict">Seu navegador não reconhece voz direto. Toque no campo, use o microfone do teclado e fale a frase:</label><input class="dict" id="dict" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Fale pelo teclado"><button class="btn ghost block" id="dictGo">Conferir</button>`;
      frame(`<div class="q-title">${ex.title}</div><div class="prompt">${speakBtns(ex.say)}<div class="bubble">${esc(ex.show)}<div class="hint" style="margin-top:4px">${esc(ex.pt)}</div>${ex.c?.pr?`<div class="hint"><i>≈ ${esc(ex.c.pr)}</i></div>`:""}</div></div>
        ${body}<div id="spRes" class="stack"></div>`,
        `<button class="btn ghost block" id="spSkip">Não posso falar agora</button>`);
      let waiting=true;
      const grade = (alts) => {
        tries++; waiting=false; disarm(); const hd=$("#heard",el); if(hd) hd.textContent="";
        let top={score:-1}; for(const a of alts){ const g=scoreSpeech(target,a); if(g.score>top.score) top=g; }
        best=Math.max(best,top.score);
        const pass = top.score>=0.8;
        beep(pass);
        $("#spRes",el).innerHTML = `<div class="score" style="color:${pass?"var(--good)":"var(--bad)"}">${Math.round(top.score*100)}%</div>
          <div class="scored">${top.marks.map(m=>`<span class="${m.ok?"w-ok":"w-no"}">${esc(m.w)}</span>`).join(" ")}</div>
          <div class="heard">Ouvi: “${esc(top.heard||"…")}”</div>
          <p class="hint">${pass?"O reconhecimento de voz entendeu você. Um americano também entenderia.":"As palavras sublinhadas não foram entendidas. Ouça o nativo de novo, foque nelas e tente outra vez."}</p>`;
        const foot=$(".foot .wrap",el);
        foot.innerHTML = pass ? `<button class="btn good block" id="spNext">Continuar</button>`
          : `<button class="btn block" id="spAgain">Tentar de novo</button><button class="btn ghost block" id="spGive">${tries>=3?"Seguir em frente":"Pular esta"}</button>`;
        if(pass) $("#spNext",el).onclick=()=>{ srsMark(ex.c,true); R.queue.shift(); R.done++; show(); };
        else { $("#spAgain",el).onclick=()=>{ waiting=true; $("#spRes",el).innerHTML=""; const f=$(".foot .wrap",el); f.innerHTML=`<button class="btn ghost block" id="spSkip">Não posso falar agora</button>`; bindSkip(); if(SR) startMic(false); else { $("#dict",el).value=""; $("#dict",el).focus(); } };
          $("#spGive",el).onclick=()=>{ srsMark(ex.c,false); R.mistakes++; R.queue.shift(); R.done++; show(); }; }
      };
      let rec=null, micStop=null, armed=false, armT=0, armWait=0, micNote="", retries=0;
      const disarm = () => { armed=false; clearTimeout(armT); };
      const armMic = () => { if(!armed) return;
        if(speechSynthesis.speaking){ if(++armWait>40){ disarm(); $("#heard",el).textContent="Toque no microfone e fale a frase"; } else armT=setTimeout(armMic,200); return; }
        disarm(); if(!document.hidden && !rec) startMic(true); };
      const listenAfterAudio = (slow, viaTimer) => { killMic(); armed=true; armWait=0; retries=0; killMic=disarm; clearTimeout(armT);
        const onEnd = () => { clearTimeout(armT); armT=setTimeout(armMic,600); };
        armT=setTimeout(armMic, 2000+target.length*90/(slow?0.6:0.95));
        if(viaTimer) autoSay(ex.say,slow,false,onEnd); else say(ex.say,slow,false,onEnd);
        $("#heard",el).textContent="Ouça a frase. O microfone liga sozinho em seguida."; };
      const startMic = auto => {
        hush();
        const r = new SR(); r.lang="en-US"; r.interimResults=true; r.maxAlternatives=3; r.continuous=false; rec=r;
        const btn=$("#micBtn",el), heard=$("#heard",el); let finalAlts=null, interim="", msg="", wd=0;
        const off = () => { clearTimeout(wd); r.onresult=r.onerror=r.onend=r.onspeechstart=null; rec=null; micStop=null; killMic=()=>{}; btn.classList.remove("on"); };
        const tooShort = a => scoreSpeech(target,a).score<0.8 && speechTokens(a).length<speechTokens(target).length*0.6;
        const end = () => { off(); const alts = finalAlts || (interim?[interim]:null);
          if(alts && alts.every(tooShort)){ const note="Ouvi só “"+alts[0].trim()+"”. Fale a frase inteira.";
            if(retries<2){ retries++; micNote=note; heard.textContent=note; armed=true; armWait=0; killMic=disarm; armT=setTimeout(armMic,400); } else { retries=0; heard.textContent=note+" Toque no microfone para tentar de novo."; } return; }
          if(alts) grade(alts); else heard.textContent = msg || "Não ouvi nada. Toque no microfone e fale mais perto dele."; };
        const hung = () => { if(!interim) msg="O reconhecimento de voz não respondeu. Ele funciona melhor no Chrome ou no Safari, com internet. Tente de novo ou toque em “Não posso falar agora”."; try{r.abort();}catch(e){} end(); };
        const arm = ms => { clearTimeout(wd); wd=setTimeout(hung,ms); };
        killMic = () => { off(); try{r.abort();}catch(e){} };
        micStop = () => { if(!interim || scoreSpeech(target,interim).score<0.8){ heard.textContent="Já estou ouvindo, pode falar a frase."; return; } heard.textContent="Conferindo…"; try{r.stop();}catch(e){} arm(2500); };
        btn.classList.add("on"); heard.textContent=micNote||"Ouvindo… pode falar a frase."; micNote="";
        r.onspeechstart = () => { if(!interim && !(auto&&speechSynthesis.speaking)) heard.textContent="Captei sua voz, pode continuar…"; };
        r.onresult = e => { if(auto&&speechSynthesis.speaking) return; const res=e.results[e.results.length-1]; interim=Array.from(e.results).map(r=>r[0].transcript).join(" ");
          heard.textContent="“"+interim+"”"; if(res.isFinal){ finalAlts=Array.from(res).map(a=>Array.from(e.results).slice(0,-1).map(r=>r[0].transcript).concat(a.transcript).join(" ")); }
          const sc=scoreSpeech(target,interim).score; if(sc>=1){ try{r.abort();}catch(e){} end(); return; }
          arm(res.isFinal?1500:sc>=0.8?1000:4000); };
        r.onerror = e => {
          if(e.error==="not-allowed"||e.error==="service-not-allowed") msg=auto?"Toque no microfone e fale a frase":"O microfone foi bloqueado. Libere o microfone para este site nas configurações do navegador.";
          else if(e.error==="no-speech") msg="Não ouvi nada. Toque e fale mais perto do microfone.";
          else if(e.error==="audio-capture") msg="Não encontrei um microfone. Confira o microfone selecionado no computador.";
          else if(e.error==="network") msg="Este navegador não conseguiu usar o reconhecimento de voz. Tente no Chrome ou no Safari, com internet.";
          else msg="Não consegui ouvir. Toque e tente de novo.";
          end(); };
        r.onend = end;
        arm(10000);
        try{ r.start(); }catch(e){ msg=auto?"Toque no microfone e fale a frase":"Não consegui ligar o microfone. Toque e tente de novo."; end(); }
      };
      const bindSkip = () => { const b=$("#spSkip",el); if(b) b.onclick=()=>{ killMic(); R.queue.shift(); R.done++; show(); }; };
      bindSkip();
      if(SR) { $("#micBtn",el).onclick=()=>{ if(rec){ micStop(); return; } disarm(); retries=0; startMic(false); };
        R.replay = slow => { if(waiting) listenAfterAudio(slow); else say(ex.say,slow); };
        listenAfterAudio(false,true); }
      else { autoSay(ex.say); const go=()=>{ const v=$("#dict",el).value.trim(); if(v) grade([v]); }; $("#dictGo",el).onclick=go; $("#dict",el).onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } }; }
    }
    else if(ex.type==="match"){
      const L1=shuffle(ex.pairs), L2=shuffle(ex.pairs); let a=null, b=null, left=ex.pairs.length, slip=false;
      frame(`<div class="q-title">${ex.title}</div><div class="pairs"><div class="col">${L1.map(p=>`<button class="pair" data-k="${p.k}" data-side="en" aria-pressed="false">${esc(p.en)}</button>`).join("")}</div><div class="col">${L2.map(p=>`<button class="pair" data-k="${p.k}" data-side="pt" aria-pressed="false">${esc(p.pt)}</button>`).join("")}</div></div>`,
        `<button class="btn block" id="chk" disabled>Continuar</button>`);
      el.querySelectorAll(".pair").forEach(btn=>btn.onclick=()=>{
        const side=btn.dataset.side;
        if(side==="en"){ if(a) a.setAttribute("aria-pressed","false"); a=btn; const p=ex.pairs.find(x=>x.k===btn.dataset.k); say(p.c.en); } else { if(b) b.setAttribute("aria-pressed","false"); b=btn; }
        btn.setAttribute("aria-pressed","true");
        if(a&&b){ if(a.dataset.k===b.dataset.k){ beep(true); a.classList.add("ok"); b.classList.add("ok"); srsMark(ex.pairs.find(x=>x.k===a.dataset.k).c,true); left--; }
          else { beep(false); slip=true; const A=a,B=b; A.classList.add("shake"); B.classList.add("shake"); setTimeout(()=>{A.classList.remove("shake");B.classList.remove("shake");},400); srsMark(ex.pairs.find(x=>x.k===a.dataset.k).c,false); }
          a.setAttribute("aria-pressed","false"); b.setAttribute("aria-pressed","false"); a=b=null;
          if(!left){ $("#chk",el).disabled=false; $("#chk",el).focus(); } }
      });
      $("#chk",el).onclick=()=>{ if(slip) R.mistakes++; R.queue.shift(); R.done++; show(); };
    }
    el.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=> R.replay ? R.replay(!!b.dataset.slow) : say(b.dataset.sp, !!b.dataset.slow, !!b.dataset.gentle));
  }
  function verdict(ok, ex){
    beep(ok); srsMark(ex.c, ok);
    el.querySelectorAll(".opt,.tile,.pair").forEach(b=>b.disabled=true);
    const correct = ex.type==="gap" ? fill(ex.sentence.replace("\u0000",ex.answer)) : ex.answer;
    const ptLine = ex.type==="choice" ? (ex.say ? "" : "") : (ex.type==="gap" ? ex.hintPt : ex.type==="dialog" ? ex.pt : ex.c ? ptOf(ex.c) : "");
    const pr = ex.c?.pr ? `<p class="tiny">Pronúncia ≈ <i>${esc(ex.c.pr)}</i></p>` : "";
    if(ok){ el.querySelectorAll('.opt[aria-pressed="true"]').forEach(b=>b.classList.add("right")); }
    else { el.querySelectorAll('.opt[aria-pressed="true"]').forEach(b=>b.classList.add("wrong")); R.mistakes++;
      if(!R.practice){ setHearts(hearts()-1); save(); } R.queue.push(Object.assign({},ex)); }
    const foot=$(".foot",el); foot.className="foot "+(ok?"ok":"no");
    const praise = ["Mandou bem!","Isso aí!","Perfeito!","Boa!","Nice!"][Math.floor(Math.random()*5)];
    foot.querySelector(".wrap").innerHTML = `<div class="fb"><h3>${ok?praise:"Resposta certa:"}</h3>${ok?"":`<p><b>${esc(correct)}</b></p>`}${ptLine?`<p class="tiny">${esc(ptLine)}</p>`:""}${pr}</div>
      <div class="row"><button class="mini-sp" id="fbSay" aria-label="Ouvir a frase">${ICON("sound")}</button><button class="btn ${ok?"good":"bad"} block" id="nx">Continuar</button></div>`;
    $("#fbSay",el).onclick=()=>say(ex.say || ex.answer, false, ex.listen);
    if(ok && ex.say && ex.type!=="choice") say(ex.say, false, ex.listen);
    $("#nx",el).focus();
    $("#nx",el).onclick=()=>{ R.queue.shift(); if(ok) R.done++;
      if(!R.practice && hearts()<=0){ el.remove(); document.body.style.overflow=""; render(); noHearts(); return; }
      show(); };
  }
  function finish(){
    const p=P(); const perfect = R.mistakes===0;
    let xp = lessonRef?.review ? 20 : 10; if(perfect) xp+=5;
    let gems = perfect?10:5;
    const d=today(); let streakUp=false;
    if(p.lastDay!==d){
      const gapDays = p.lastDay ? dayDiff(p.lastDay,d) : 99;
      if(gapDays===1) p.streak++; else if(gapDays===2 && p.freezes>0){ p.freezes--; p.streak++; } else p.streak=1;
      p.lastDay=d; streakUp=true; if(p.streak%7===0) gems+=20;
    }
    p.bestStreak=Math.max(p.bestStreak,p.streak);
    p.xp+=xp; p.gems+=gems;
    if(p.today.d!==d) p.today={d,xp:0};
    const before=p.today.xp; p.today.xp+=xp;
    if(before<p.goal && p.today.xp>=p.goal){ p.gems+=10; if(!p.badges.includes("goal")) p.badges.push("goal"); }
    const wk=weekKey(); p.week[wk]=(p.week[wk]||0)+xp;
    const keys=Object.keys(p.week).sort(); while(keys.length>12) delete p.week[keys.shift()];
    const now=Date.now();
    for(const [k,ok] of R.results){ const r=p.srs[k]||{s:0,due:0}; r.s = ok ? Math.min(5,r.s+1) : Math.max(0,r.s-1); r.due = now + SRS_DAYS[r.s]*864e5; p.srs[k]=r; }
    if(R.practice){ p.practiceDone++; setHearts(hearts()+1); }
    else { p.lessonsDone++; if(perfect) p.perfect++; if(lessonRef){ const cur=p.levels[lessonRef.day]||0; if(level>=cur) p.levels[lessonRef.day]=Math.min(levelsFor(lessonRef),level+1); } }
    const beforeBadges = new Set(p.badges);
    badgeDefs().forEach(b=>{ if(b.ok && !p.badges.includes(b.id)) p.badges.push(b.id); });
    const newBadges = badgeDefs().filter(b=>p.badges.includes(b.id) && !beforeBadges.has(b.id) && b.id!=="goal");
    save();
    const secs=Math.round((Date.now()-R.started)/1000); const acc=Math.round(R.total/(R.total+R.mistakes)*100);
    beep(true);
    el.innerHTML=`<div class="body"><div class="wrap result">
      <div style="color:var(--gold)">${ICON(perfect?"trophy":"star")}</div>
      <h1>${perfect?"Lição perfeita!":"Lição concluída!"}</h1>
      <p class="muted">${esc(L.title)}${streakUp?` · sequência de ${p.streak} dia${p.streak>1?"s":""}`:""}</p>
      <div class="tiles3">
        <div class="t"><div class="h" style="background:var(--gold)">XP</div><div class="v">+${xp}</div></div>
        <div class="t"><div class="h" style="background:var(--good)">Precisão</div><div class="v">${acc}%</div></div>
        <div class="t"><div class="h" style="background:var(--qa)">Tempo</div><div class="v">${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</div></div>
      </div>
      <p class="muted tiny">+${gems} gemas${R.practice?" · +1 coração":""}</p>
      ${newBadges.map(b=>`<div class="badge got" style="width:100%"><span class="md">${ICON(b.i)}</span><span><b>Nova conquista: ${esc(b.n)}</b><span>${esc(b.d)}</span></span></div>`).join("")}
    </div></div><div class="foot"><div class="wrap"><button class="btn block" id="done">Continuar</button></div></div>`;
    $("#done",el).onclick=quit;
  }
  show();
}

/* ---------- boot ---------- */
loadLocal();
render();
const slowT=setTimeout(()=>{ S.late=true; if(!S.loaded) render(); },10000);

(async()=>{
  try{
    const r = await fetch("lessons.json?v="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const data = await r.json();
    S.lessons = (Array.isArray(data)?data:[]).filter(x=>x && typeof x.day==="number");
    try{ localStorage.setItem("chunks.lessonsCache", JSON.stringify(S.lessons)); }catch(e){}
  }catch(e){
    S.lessons = LS.get("lessonsCache", []);
    if(S.lessons.length) toast("Sem conexão: mostrando as lições salvas neste aparelho.");
  }
  S.loaded=true; S.late=false; clearTimeout(slowT);
  if(!document.querySelector(".lesson")) render();
})();
setInterval(()=>{ if(S.pid && !document.querySelector(".lesson")) renderTop(); }, 60000);
})();
</script>
